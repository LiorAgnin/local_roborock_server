[project]
name = "roborock-local-server"
version = "1.1.0"
description = "private local Roborock server stack."
requires-python = ">=3.11,<3.14"
readme = "README.md"
authors = [{ name = "Luke Lashley" }]
dependencies = [
  "aiohttp>=3.9,<4",
  "cryptography>=42,<47",
  "fastapi>=0.115,<1",
  "gmpy2>=2.3,<3",
  "pycryptodome>=3.20,<4",
  "python-roborock==4.20.0",
  "python-multipart>=0.0.32,<0.1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.6,<10",
  "pyright>=1.1.414,<2",
  "pytest>=8,<9",
]

[project.scripts]
roborock-local-server = "roborock_local_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roborock_local_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
pythonVersion = "3.11"
# Bundled backend modules import each other as top-level packages (`from shared ...`).
extraPaths = ["src", "src/roborock_local_server/bundled_backend"]
include = [
  "src/roborock_local_server/bundled_backend/shared/protocol_auth.py",
  "src/roborock_local_server/bundled_backend/shared/decoder.py",
  "src/roborock_local_server/bundled_backend/mqtt_broker_server/topic_bridge.py",
  "src/roborock_local_server/bundled_backend/mqtt_tls_proxy_server",
]
strict = [
  "src/roborock_local_server/bundled_backend/shared/protocol_auth.py",
  "src/roborock_local_server/bundled_backend/shared/decoder.py",
  "src/roborock_local_server/bundled_backend/mqtt_broker_server/topic_bridge.py",
  "src/roborock_local_server/bundled_backend/mqtt_tls_proxy_server",
]
