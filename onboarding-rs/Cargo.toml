[package]
name = "roborock-onboard"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Guided vacuum onboarding (CLI and local web UI) for the Roborock Local Server"
repository = "https://github.com/LiorAgnin/local_roborock_server"
publish = false

[[bin]]
name = "roborock-onboard"
path = "src/main.rs"

[dependencies]
aes = "0.8"
clap = { version = "4.6", features = ["derive", "env"] }
crc32fast = "1.5"
ctrlc = "3.5"
open = "5.4"
rpassword = "7.5"
rsa = { version = "0.9.10", features = ["pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tiny_http = "0.12"
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rcgen = "0.14"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
